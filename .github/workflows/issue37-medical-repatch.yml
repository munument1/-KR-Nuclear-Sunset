name: Issue 37 Aid Addon safe repatch regression
on:
  pull_request:
    paths:
      - 'patcher/nskr_medical_bag.py'
      - 'patcher/tests/test_medical_bag.py'
      - '.github/workflows/issue37-medical-repatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-script-repatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact Aid Addon replay and surrounding script safety
        working-directory: patcher
        run: |
          python -m unittest discover -s tests -p test_medical_bag.py -v
          python -m unittest discover -s tests -p test_compiled_scpt.py -v
          python -m unittest discover -s tests -p test_dynamic_display.py -v
