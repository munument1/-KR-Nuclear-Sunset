name: Issue 37 Aid Addon safe repatch regression
on:
  pull_request:
    paths:
      - 'patcher/nskr_medical_bag.py'
      - 'patcher/tests/test_medical_bag.py'
      - 'patcher/nskr.py'
      - 'patcher/tools/build_v1_1_4_release.py'
      - 'patcher/tools/verify_issue37_repatch.py'
      - '.github/workflows/issue37-medical-repatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-script-repatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact Aid Addon replay and surrounding script safety
        working-directory: patcher
        run: |
          python -m unittest discover -s tests -p test_medical_bag.py -v
          python -m unittest discover -s tests -p test_compiled_scpt.py -v
          python -m unittest discover -s tests -p test_dynamic_display.py -v
  windows-package:
    needs: reviewed-script-repatch
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Download official baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.1.3 --repo "${{ github.repository }}" --pattern "NuclearSunset-Korean-Patcher-v1.1.3.zip" --dir "${{ runner.temp }}/baseline"
      - name: Build and verify release packages
        run: python patcher/tools/build_v1_1_4_release.py --base "${{ runner.temp }}/baseline/NuclearSunset-Korean-Patcher-v1.1.3.zip" --work "${{ runner.temp }}/release-build"
      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-sunset-v1.1.4-release
          path: ${{ runner.temp }}/release-build/output/*
          retention-days: 30
