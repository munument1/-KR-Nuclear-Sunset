name: Issue 27 save header encoding tests

on:
  pull_request:
    paths:
      - 'patcher/tools/audit_save_title_header.py'
      - 'patcher/tests/test_save_title_header.py'
      - 'patcher/tools/verify_issue27_reporter_save.py'
      - '.github/workflows/issue27-save-header-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic save header fixtures and format invariants
        working-directory: patcher
        run: python -m unittest discover -s tests -p 'test_save_title_header.py' -v
      - name: Verify Python source can be parsed and compiled
        run: python -m py_compile patcher/tools/audit_save_title_header.py
      - name: Read-only verify exact attached save against pinned SHA
        env:
          SOURCE: https://github.com/user-attachments/files/34214889/Save.zip
        run: |
          curl --fail --location --silent --show-error --max-time 60 "$SOURCE" -o "$RUNNER_TEMP/issue27-reporter.zip"
          cd patcher
          python -m tools.verify_issue27_reporter_save "$RUNNER_TEMP/issue27-reporter.zip"
