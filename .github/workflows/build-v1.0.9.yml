name: Build and publish Nuclear Sunset v1.0.9

on:
  pull_request:
    paths:
      - 'patcher/nskr.py'
      - 'patcher/nskr_issue20_casings.py'
      - 'patcher/nskr_stewie_book_effects.py'
      - 'patcher/tools/build_v1_0_9_release.py'
      - 'patcher/tools/audit_save_title_header.py'
      - 'patcher/tests/test_save_title_header.py'
      - 'patcher/docs/releases/v1.0.9.md'
      - '.github/workflows/build-v1.0.9.yml'
  push:
    branches: [main]
    paths:
      - 'patcher/tools/build_v1_0_9_release.py'
      - '.github/workflows/build-v1.0.9.yml'

permissions:
  contents: write

concurrency:
  group: nskr-v1.0.9-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install reviewed packaging tool
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Run focused translation and save-header tests
        working-directory: patcher
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_stewie_book_effects.py -v
          python -m unittest discover -s tests -p test_issue20_spare_casings.py -v
          python -m unittest discover -s tests -p test_save_title_header.py -v
      - name: Fetch official v1.0.8 binaries and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\baseline" | Out-Null
          gh release download v1.0.8 --repo "$env:GITHUB_REPOSITORY" --pattern "NuclearSunset-Korean-Patcher-v1.0.8.zip" --pattern "SHA256SUMS.txt" --dir "$env:RUNNER_TEMP\baseline"
      - name: Build full v1.0.9 onedir ZIP and standalone TranslationData ZIP
        shell: pwsh
        run: |
          python patcher/tools/build_v1_0_9_release.py --base "$env:RUNNER_TEMP\baseline\NuclearSunset-Korean-Patcher-v1.0.8.zip" --checksums "$env:RUNNER_TEMP\baseline\SHA256SUMS.txt" --work "$env:RUNNER_TEMP\nskr-1.0.9-build"
      - name: Upload fully verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-sunset-v1.0.9-verified
          path: ${{ runner.temp }}/nskr-1.0.9-build/output/*
          retention-days: 30
      - name: Publish GitHub v1.0.9 after verified main-branch build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.9"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing overwrite" }
          $folder = "$env:RUNNER_TEMP\nskr-1.0.9-build\output"
          gh release create $tag "$folder\NuclearSunset-Korean-Patcher-v1.0.9.zip" "$folder\NuclearSunset-TranslationData-v1.0.9.zip" "$folder\SHA256SUMS.txt" "$folder\build-report.json" --target "$env:GITHUB_SHA" --title "Nuclear Sunset Korean Patcher v1.0.9" --notes-file "patcher/docs/releases/v1.0.9.md" --repo "$env:GITHUB_REPOSITORY"
