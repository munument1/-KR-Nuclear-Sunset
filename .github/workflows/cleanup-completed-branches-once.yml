name: One-time verified branch cleanup (-KR-Nuclear-Sunset)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'munument1/-KR-Nuclear-Sunset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const items = [{"branch":"docs/detailed-install-guide-20261010","sha":"db105c2196e16ef3f0afab51bf13a80e6d5bc474","pr":3,"base":"main"},{"branch":"fix/existing-korean-json-upgrade-20261020","sha":"cbc05a0169d3d03e50801ccfcbd053ef351c6cb5","pr":12,"base":"main"},{"branch":"fix/hacking-font-grid","sha":"55c2483804d86482f981ebe72375c8fd2b7c2620","pr":6,"base":"main"},{"branch":"fix/issue13-untranslated-20261023","sha":"dd8ef49928e36ab6f256e75179053985b7a943f0","pr":16,"base":"main"},{"branch":"fix/issue18-composed-dialogue","sha":"2942d7e5089699c76d3106a5aa67708c3c9e6058","pr":19,"base":"main"},{"branch":"fix/key-prompt-encoding","sha":"941dc4f90c5085fe29f4e6ffaeef3167e0c20d5f","pr":7,"base":"main"},{"branch":"fix/output-inside-mo2-20261018","sha":"e27a7f8cf469d530be41bd0687b6b9888ef7a83a","pr":null,"base":null},{"branch":"fix/pretendard-glyph-v1.0.1","sha":"26671283dc76e276a8b720e41226d4c9131805eb","pr":5,"base":"main"},{"branch":"i18n/faq-20261010","sha":"cd6148240687e6ee4f32a8273bc29df92907158d","pr":2,"base":"main"},{"branch":"i18n/windows-setup-20261010","sha":"9a06bc452570af53efbd33336238f47725ad2a94","pr":1,"base":"main"}];
            const owner=context.repo.owner, repo=context.repo.repo;
            if (owner!=='munument1'||repo!=="-KR-Nuclear-Sunset"||context.ref!=='refs/heads/main') throw Error('Wrong repository/ref');
            const openPRs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(openPRs.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0; const skipped=[];
            for(const item of items){
              if(item.branch==='main'||item.branch==='gh-pages'||blocked.has(item.branch)) {skipped.push(item.branch+': protected by policy/PR');continue;}
              const b=(await github.rest.repos.getBranch({owner,repo,branch:item.branch})).data;
              if(b.protected||b.commit.sha!==item.sha){skipped.push(item.branch+': ref changed/protected');continue;}
              if(item.pr!==null){
                const p=(await github.rest.pulls.get({owner,repo,pull_number:item.pr})).data;
                if(!p.merged_at||p.head.ref!==item.branch||p.head.sha!==item.sha||p.base.ref!==item.base){skipped.push(item.branch+': PR altered');continue;}
              }
              if(item.base!=='main'){
                const diff=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:'main...'+item.branch})).data;
                if(diff.ahead_by!==0){skipped.push(item.branch+': unique commits');continue;}
              }
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.branch});
              deleted++;core.info('DELETED '+item.branch);
            }
            core.info('Branch cleanup: '+deleted+' deleted, '+skipped.length+' skipped from '+items.length+' candidates');
            for(const note of skipped)core.warning('SKIPPED '+note);
            await core.summary.addHeading('One-time branch cleanup').addRaw('Deleted '+deleted+' of '+items.length+'. Skipped '+skipped.length+'.').write();
