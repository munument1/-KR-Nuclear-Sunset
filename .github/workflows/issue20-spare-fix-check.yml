name: Issue 20 SPARE casing source/release validation

on:
  pull_request:
    paths:
      - 'patcher/nskr_issue20_casings.py'
      - 'patcher/nskr_output.py'
      - 'patcher/tests/test_issue20_spare_casings.py'
      - 'patcher/tools/verify_issue20_spare_release.py'
      - '.github/workflows/issue20-spare-fix-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact mapping tests
        working-directory: patcher
        run: python -m unittest discover -s tests -p 'test_issue20_spare_casings.py' -v
      - name: Download published v1.0.8 release TranslationData
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.8 --repo "$GITHUB_REPOSITORY" \
            --pattern 'NuclearSunset-TranslationData-v1.0.8.zip' \
            --dir "$RUNNER_TEMP"
      - name: Verify seven corrections against real release metadata
        run: |
          python patcher/tools/verify_issue20_spare_release.py \
            "$RUNNER_TEMP/NuclearSunset-TranslationData-v1.0.8.zip"
