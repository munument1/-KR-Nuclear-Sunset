name: Build and release Nuclear Sunset Pretendard font fix
on:
  push:
    branches: [main, fix/pretendard-glyph-v1.0.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Download published v1.0.0 assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .base-release | Out-Null
          gh release download v1.0.0 -p 'NuclearSunset-Korean-Patcher-v1.0.0.zip' -p 'NuclearSunset-TranslationData-v1.0.0.zip' -p 'SHA256SUMS.txt' --dir .base-release
          if ($LASTEXITCODE) { throw 'Base release download failed' }
      - name: Recover resources and replace six font faces
        shell: pwsh
        run: |
          Set-Location patcher
          python tools/repack_pretendard_release.py prepare --release ../.base-release --work ../.release-work
          if ($LASTEXITCODE) { throw 'Release recovery or font replacement failed' }
      - name: Run original patcher unit tests
        shell: pwsh
        run: |
          Set-Location patcher
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Regression tests failed' }
      - name: Build standalone NuclearSunsetKoreanPatcher.exe
        shell: pwsh
        run: |
          Set-Location patcher
          New-Item -ItemType Directory -Force dist/pretendard,dist/pretendard-work,dist/pretendard-spec | Out-Null
          $buildArgs = @(
            '-m','PyInstaller','--noconfirm','--onefile','--windowed',
            '--name','NuclearSunsetKoreanPatcher',
            '--distpath','dist/pretendard',
            '--workpath','dist/pretendard-work',
            '--specpath','dist/pretendard-spec',
            '--add-data','../.release-work/TranslationData;TranslationData',
            '--add-binary','../.release-work/NSKRXEditWorker.exe;.',
            '--add-binary','../.release-work/Backend/XEditLib.dll;Backend',
            '--add-data','../.release-work/Backend/FalloutNV.Hardcoded.dat;Backend',
            '--add-data','../.release-work/Backend/icudtl.dat;Backend',
            '--add-data','../.release-work/Backend/LICENSE;Backend',
            'nskr_gui.py'
          )
          python @buildArgs
          if ($LASTEXITCODE) { throw 'Standalone EXE build failed' }
      - name: Verify only XML/catalog changed and package release
        shell: pwsh
        run: |
          Set-Location patcher
          python tools/repack_pretendard_release.py package --release ../.base-release --work ../.release-work --exe dist/pretendard/NuclearSunsetKoreanPatcher.exe --output ../.release-assets
          if ($LASTEXITCODE) { throw 'Unexpected resource changes detected' }
      - uses: actions/upload-artifact@v4
        with:
          name: NuclearSunset-Pretendard-v1.0.1-preview
          path: |
            .release-assets/NuclearSunset-Korean-Patcher-v1.0.1.zip
            .release-assets/NuclearSunset-TranslationData-v1.0.1.zip
            .release-assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release v1.0.1
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          Set-Location patcher
          $version = python -c "import nskr; print(nskr.VERSION)"
          if ($version -ne '1.0.1') { throw 'Wrong build version' }
          gh release view v1.0.1 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release exists'; exit 0 }
          gh release create v1.0.1 ../.release-assets/NuclearSunset-Korean-Patcher-v1.0.1.zip ../.release-assets/NuclearSunset-TranslationData-v1.0.1.zip ../.release-assets/SHA256SUMS.txt --target '${{ github.sha }}' --title 'Nuclear Sunset Korean Patcher v1.0.1 - Pretendard' --notes-file ../docs/releases/v1.0.1.md --latest
          if ($LASTEXITCODE) { throw 'GitHub release publication failed' }
