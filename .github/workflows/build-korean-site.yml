name: Build Korean Nuclear Sunset
on:
  push:
    branches: [main]
    paths:
      - 'translations/**'
      - 'scripts/**'
      - '.github/workflows/build-korean-site.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nuclear-sunset-korean-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Korean translations
        uses: actions/checkout@v4
        with:
          path: korean
      - name: Check out Nuclear Sunset source at validated revision
        uses: actions/checkout@v4
        with:
          repository: FinalCatalyst/Nuclear-Sunset
          ref: 50a606c7d43ffe0a338d22812661c5bfeba64dce
          path: upstream
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Overlay translated documents
        run: |
          cp -a korean/translations/docs/. upstream/docs/
          node korean/scripts/configure-site.cjs upstream
      - name: Build Docusaurus site
        run: |
          cd upstream
          npm ci
          npm run build
      - name: Remove upstream custom domain
        run: rm -f upstream/build/CNAME
      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./upstream/build
          publish_branch: gh-pages
          force_orphan: true
