name: Publish patcher to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank selects latest stable release)'
        type: string
        required: false
      dry_run:
        description: 'Verify release and package without uploading'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Select published patcher release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          script: |
            const repo = context.repo;
            let release;
            if (context.eventName === 'release') {
              release = context.payload.release;
            } else if (process.env.REQUESTED_TAG) {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag: process.env.REQUESTED_TAG })).data;
            } else {
              release = (await github.rest.repos.getLatestRelease(repo)).data;
            }
            if (release.draft || release.prerelease) {
              core.setFailed('Only published stable releases can be uploaded.');
              return;
            }
            if (!/^v?\d+(?:\.\d+){1,3}$/.test(release.tag_name)) {
              core.setFailed('Expected a numeric version tag such as v1.2.3.');
              return;
            }
            const assetName = `NuclearSunset-Korean-Patcher-${release.tag_name}.zip`;
            const checksumsName = 'SHA256SUMS.txt';
            const asset = release.assets.find(a => a.name === assetName);
            const checksums = release.assets.find(a => a.name === checksumsName);
            if (!asset || !checksums || asset.state !== 'uploaded' || checksums.state !== 'uploaded') {
              core.setFailed('Expected patcher and checksum assets are missing or unfinished.');
              return;
            }
            core.setOutput('ready', 'true');
            core.setOutput('tag', release.tag_name);
            core.setOutput('asset', assetName);
            core.setOutput('checksums', checksumsName);
            core.setOutput('version', '' + release.tag_name.replace(/^v/, ''));
            core.setOutput('url', release.html_url);

      - name: Download release assets
        if: steps.release.outputs.ready == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: gh release download "$TAG" --pattern "$ASSET" --pattern "$CHECKSUMS" --dir release-assets

      - name: Verify checksum and prepare ZIP
        if: steps.release.outputs.ready == 'true'
        id: package
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          root = Path('release-assets')
          asset = root / os.environ['ASSET']
          expected = []
          for line in (root / os.environ['CHECKSUMS']).read_text(encoding='utf-8-sig').splitlines():
              match = re.fullmatch(r'([0-9a-fA-F]{64})\s+\*?(.+)', line)
              if match and match[2] == asset.name:
                  expected.append(match[1].lower())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          if expected != [digest]:
              raise SystemExit('Missing, ambiguous, or mismatched SHA256 checksum')
          if asset.suffix.lower() == '.exe':
              if asset.read_bytes()[:2] != b'MZ':
                  raise SystemExit('Invalid Windows executable')
              package = asset.with_suffix('.zip')
              with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.write(asset, asset.name)
          else:
              package = asset
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None or not archive.namelist():
                  raise SystemExit('Invalid or empty ZIP')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'filename={package.as_posix()}\n')
          print(f'Verified {asset.name}: {digest}')
          PY

      - name: Find Nexus file and check existing versions
        if: steps.release.outputs.ready == 'true'
        id: nexus
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const key = process.env.NEXUS_API_KEY;
            if (!key) {
              core.setFailed('Add the NEXUS_KEY repository secret first.');
              return;
            }
            core.setSecret(key);
            if (key !== key.trim()) throw new Error('Store NEXUS_KEY without surrounding whitespace.');
            async function nexus(path) {
              const response = await fetch('https://api.nexusmods.com' + path, {
                headers: { apikey: key, 'User-Agent': 'KR-Patcher-Release-Sync' },
                redirect: 'error'
              });
              if (!response.ok) throw new Error(`Nexus API returned HTTP ${response.status} for ${path}`);
              return response.json();
            }
            const user = await nexus('/v1/users/validate.json');
            const mod = await nexus('/v1/games/newvegas/mods/99974.json');
            if (String(user.user_id) !== String(mod.user?.member_id)) {
              throw new Error('The API key account must own Nexus mod 99974.');
            }
            if (!mod.uid) throw new Error('Nexus did not return a mod UID.');
            const files = (await nexus(`/v3/mods/${mod.uid}/files`)).data.mod_files;
            core.info('Active Nexus files: ' + JSON.stringify(files.filter(f => f.is_active).map(f => ({id: f.id, name: f.name}))));
            const configured = process.env.NEXUS_FILE_ID;
            const candidates = configured
              ? files.filter(f => String(f.id) === configured && f.is_active)
              : files.filter(f => f.is_active);
            if (candidates.length !== 1) {
              throw new Error('Expected one active file. Set NEXUSMODS_FILE_ID to the upload API File ID from Manage Files/Advanced.');
            }
            const fileId = String(candidates[0].id);
            core.setOutput('file_id', fileId);
            const versions = (await nexus(`/v3/mod-files/${fileId}/versions`)).data.versions;
            core.info('Existing versions: ' + JSON.stringify(versions.map(v => ({version: v.version, category: v.category}))));
            if (versions.some(v => v.version === process.env.VERSION && !['removed', 'archived'].includes(v.category))) {
              core.notice('This version already exists on Nexus; skipping duplicate upload.');
              return;
            }
            core.setOutput('file_id', fileId);
            core.setOutput('upload', 'true');

      - name: Upload new Nexus version
        id: upload
        if: steps.nexus.outputs.upload == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && !(github.event_name == 'release' && contains(fromJSON('["v1.1.0", "v1.1.1"]'), github.event.release.tag_name))
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          filename: ${{ steps.package.outputs.filename }}
          version: ${{ steps.release.outputs.version }}
          display_name: 'Nuclear Sunset Korean Patcher ${{ steps.release.outputs.version }}'
          description: |
            Korean translation patcher for an existing Nuclear Sunset installation. Original games and the modlist must be installed separately. Includes a Korean UI support ESP. Extract the entire folder package before running the patcher.
            [b]v1.1.0 update:[/b] Fixed the save/load level title display in the main menu with a targeted tNVSE renderer correction. The reported Korean title was confirmed in the game. Also includes a statically verified medical-bag text correction; the medical-bag fix has not yet been confirmed in game. Existing .fos save files remain untouched. Extract the full patcher into a new folder, regenerate Output and restart the game.
            [b]v1.1.0 업데이트:[/b] 메인 메뉴 세이브 목록의 레벨 칭호가 깨지는 문제를 tNVSE 렌더러에서 수정하고 게임 화면의 정상 표시를 확인했습니다. 의료 가방 텍스트도 정적 대조를 거쳐 수정했으나 해당 항목의 실게임 검증은 아직 수행하지 않았습니다. 기존 .fos 세이브 파일은 변경하지 않습니다. 전체 패처 ZIP을 새 폴더에 풀어 Output을 다시 생성하고 게임을 재시작하세요.
            [b]v1.1.1 업데이트:[/b] B42 Descriptions Revised 및 호환 모드의 아이템 설명 INI 118개에 기존 검수된 한국어 번역 2,992건을 반영합니다. 원본 파일 SHA와 문자열 식별자를 확인한 뒤 새 Output에만 적용합니다. B42 아이템 설명의 실게임 출력은 아직 검증되지 않았으며, 좌측 상단 알림 깨짐(#22)과 다른 발광 버섯 출력 경로(#29)는 계속 조사합니다.
            [url=https://munument1.github.io/-KR-Nuclear-Sunset/docs/main/korean-patch]Installation and recovery guide (Korean)[/url]
            [url=${{ steps.release.outputs.url }}]GitHub release[/url]
          category: main
          archive_existing_version: 'false'
          allow_mod_manager_download: 'false'
          update_mod_version: 'true'

      - name: Verify published Nexus version through API
        if: steps.upload.outcome == 'success'
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_KEY }}
          FILE_ID: ${{ steps.nexus.outputs.file_id }}
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const key = process.env.NEXUS_API_KEY;
            core.setSecret(key);
            const response = await fetch('https://api.nexusmods.com/v3/mod-files/' + process.env.FILE_ID + '/versions', {
              headers: { apikey: key, 'User-Agent': 'KR-Patcher-Release-Sync' }, redirect: 'error'
            });
            if (!response.ok) throw new Error('Nexus readback HTTP ' + response.status);
            const versions = (await response.json()).data.versions;
            const published = versions.find(v => v.version === process.env.VERSION && v.category === 'main');
            if (!published) throw new Error('New main version missing from Nexus API readback');
            core.info('Verified Nexus main version: ' + published.version);
            async function api(path, body) {
              const r = await fetch('https://api.nexusmods.com' + path, {
                method: body ? 'POST' : 'GET',
                headers: { apikey: key, 'Content-Type': 'application/json', 'User-Agent': 'KR-Patcher-Release-Sync' },
                body: body ? JSON.stringify(body) : undefined, redirect: 'error'
              });
              if (!r.ok) throw new Error('Nexus API HTTP ' + r.status);
              return r.json();
            }
            const mod = await api('/v1/games/newvegas/mods/99974.json');
            const logs = await api('/v1/games/newvegas/mods/99974/changelogs.json');
            if (!Object.keys(logs).some(v => v.toLowerCase() === process.env.VERSION.toLowerCase())) {
              await api('/v3/mods/' + mod.uid + '/changelogs', {
                version: process.env.VERSION,
                changelog: '아이템 획득·구매·제거 알림에서 UTF-8 이름과 CP949 문구가 섞일 때 이름이 깨지는 문제 수정. 네이티브 회귀 178건과 패쳐 검사 통과. 실게임 알림 화면은 미검증. 전체 ZIP을 새 폴더에 풀고 새 Output을 생성해 적용하세요.'
              });
            }
            core.info('NEXUS_PUBLICATION_READBACK ' + JSON.stringify({mod_id: 99974, group: process.env.FILE_ID, version: published.version, version_id: published.id, game_scoped_file_id: published.game_scoped_id, changelog_confirmed: true}));

      - name: Write run summary
        if: steps.release.outputs.ready == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE_ID: ${{ steps.nexus.outputs.file_id }}
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "Release: $TAG"
            echo "Package checksum and ZIP verified."
            echo "Dry run: $DRY_RUN"
            echo "Upload performed: ${UPLOADED:-false}"
            echo "Nexus file ID: ${FILE_ID:-not selected}"
          } >> "$GITHUB_STEP_SUMMARY"
