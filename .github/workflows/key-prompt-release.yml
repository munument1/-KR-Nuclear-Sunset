name: Build confirmed key prompt encoding fix
on:
  push:
    branches: [fix/key-prompt-encoding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/patcher
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3
      - name: Download base release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force patcher/.local/base-key-prompt | Out-Null
          gh release download v1.0.2 -R munument1/-KR-Nuclear-Sunset -p 'NuclearSunset-Korean-Patcher-v1.0.2.zip' --dir patcher/.local/base-key-prompt
          if ($LASTEXITCODE) { throw 'Base download failed' }
      - name: Regression tests
        shell: pwsh
        run: |
          Set-Location patcher
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Regression tests failed' }
      - name: Build and verify release
        working-directory: patcher
        run: python tools/build_key_prompt_release.py --base .local/base-key-prompt/NuclearSunset-Korean-Patcher-v1.0.2.zip --sha256 3b9e3ffc451966307c67db40fceb4ccc51201503d820955c4824600407b9a06a --project ns --work .local/key-prompt-build --output dist/key-prompt-release
      - uses: actions/upload-artifact@v4
        with:
          name: NS-key-prompt-v1.0.3
          path: patcher/dist/key-prompt-release/*
          if-no-files-found: error

