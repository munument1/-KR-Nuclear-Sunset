name: Build Nuclear Sunset folder patcher
on:
  push:
    branches: [fix/folder-patcher-v1.0.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}/patcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Regression tests
        working-directory: patcher
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Regression tests failed' }
      - name: Download pinned v1.0.3 resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force patcher/.local/folder-base | Out-Null
          gh release download v1.0.3 -R munument1/-KR-Nuclear-Sunset -p NuclearSunset-Korean-Patcher-v1.0.3.zip --dir patcher/.local/folder-base
          if ($LASTEXITCODE) { throw 'Base release download failed' }
      - name: Build and verify folder release
        working-directory: patcher
        run: python tools/build_folder_release.py --base .local/folder-base/NuclearSunset-Korean-Patcher-v1.0.3.zip --work .local/folder-build --output dist/folder-release
      - uses: actions/upload-artifact@v4
        with:
          name: NuclearSunset-folder-v1.0.4
          path: patcher/dist/folder-release/*
          if-no-files-found: error
